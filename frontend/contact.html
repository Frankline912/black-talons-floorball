<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - DEKUT Floorball (Black Talons)</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-container {
            max-width: 600px;
            margin: 3rem auto;
            background: var(--white);
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
        }
        .alert {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .alert-error { background-color: #fee2e2; color: #991b1b; }
        .alert-success { background-color: #dcfce7; color: #166534; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <a href="index.html" class="logo">BLACK TALONS</a>
        <div class="menu-toggle" id="mobile-menu">☰</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="players.html">Team</a></li>
                <li><a href="matches.html">Matches</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <!-- Page Header -->
    <section class="hero" style="padding: 4rem 2rem; text-align: center;">
        <h1>Get in Touch</h1>
        <p>Want to join the club, sponsor us, or ask a question? Send us a message!</p>
    </section>

    <!-- Contact Form Section -->
    <div class="contact-container">
        <h2 style="margin-bottom: 1.5rem; color: var(--primary-color);">Send a Message</h2>
        <div id="contact-alert" class="alert hidden"></div>
        <form id="contact-form">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="jane@example.com">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" required placeholder="I would love to join the team training sessions..."></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Send Message</button>
        </form>
    </div>

    <!-- Footer with Dynamic Instagram Link -->
    <footer>
        <div style="margin-bottom: 1rem; text-align: center;">
            <a id="footer-instagram-link" href="https://instagram.com" target="_blank" style="color: var(--accent-color); text-decoration: none; font-weight: bold; font-size: 1.1rem;">
                📷 Follow us on Instagram
            </a>
        </div>
        <p style="text-align: center; color: #64748b; font-size: 0.9rem;">&copy; 2026 DEKUT Floorball (Black Talons). All rights reserved.</p>
    </footer>

    <!-- JavaScript to Handle Submission & Dynamic Footer -->
    <script src="js/api.js"></script>
    <script>
        // Updated to point to your live Render backend
        const API_URL = "https://black-talons-floorball-1.onrender.com";
        
        const contactForm = document.getElementById("contact-form");
        const contactAlert = document.getElementById("contact-alert");

        // Mobile Menu Toggle
        document.getElementById("mobile-menu").addEventListener("click", () => {
            const nav = document.querySelector("nav ul");
            nav.classList.toggle("showing");
        });

        // Contact Form Submit Handler
        contactForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                message: document.getElementById("message").value
            };

            try {
                // If submitContactForm uses API_URL internally, make sure it references the global API_URL or fetch directly here:
                const res = await fetch(`${API_URL}/contact/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                });

                if (res.ok) {
                    contactAlert.textContent = "Thank you! Your message has been sent successfully.";
                    contactAlert.className = "alert alert-success";
                    contactAlert.classList.remove("hidden");
                    contactForm.reset();
                } else {
                    throw new Error();
                }
            } catch (error) {
                contactAlert.textContent = "Failed to send message. Please try again later.";
                contactAlert.className = "alert alert-error";
                contactAlert.classList.remove("hidden");
            }
        });

        // Automatically fetch the dynamic Instagram link from the backend on page load
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch(`${API_URL}/socials/`);
                const socials = await res.json();
                const insta = socials.find(s => s.platform.toLowerCase() === "instagram");
                if (insta && insta.url) {
                    const linkEl = document.getElementById("footer-instagram-link");
                    if (linkEl) linkEl.href = insta.url;
                }
            } catch (e) {
                // Fails safely if the backend server is offline
            }
        });
    </script>
</body>
</html>
